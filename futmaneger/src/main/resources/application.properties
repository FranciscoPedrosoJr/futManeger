server.port=10300
spring.datasource.url=jdbc:h2:file:./data/futmanager
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# CORS: origens do front aceitas (separadas por virgula). O navegador compara a origem
# inteira, entao localhost e 127.0.0.1 sao origens diferentes. Para testar por outro
# endereco (ex.: IP da rede), acrescente aqui, como http://192.168.18.162:*
futmaneger.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# Financeiro: taxas aplicadas sobre o valor de mercado do elenco a cada ciclo de rodadas.
# Receita (cota de TV + patrocinio) fica um pouco abaixo da folha salarial para que clubes
# de elenco caro operem perto do equilibrio e clubes de elenco barato tenham lucro.
futmaneger.financeiro.percentual-salario=0.02
futmaneger.financeiro.percentual-cota-tv=0.011
futmaneger.financeiro.percentual-patrocinio=0.008
futmaneger.financeiro.limite-divida-sobre-elenco=0.35
# Preco de ingresso usado por clubes sem tecnico que nao definiram preco
futmaneger.financeiro.preco-ingresso-padrao=50
futmaneger.financeiro.rodadas-por-ciclo=6
